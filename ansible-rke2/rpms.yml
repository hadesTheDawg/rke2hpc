---
# Publish the site's own RPMs (hpc_local_rpms_dir, default inventories/<site>/rpms)
# as the "hpc-local" repository on every node, and optionally install packages
# now. ./import-rpms.sh copies RPMs there and runs this (docs/rpms.md).
#   ansible-playbook -i inventories/<site>/hosts.yml rpms.yml
#   ansible-playbook -i ... rpms.yml -e '{"hpc_rpms_install": ["mytool"], "hpc_rpms_install_hosts": "rke2_agents"}'
# Packages that must stay installed (also after a node is re-provisioned) belong
# in hpc_local_packages / _admin / _compute; site.yml installs those.
- name: Facts
  hosts: rke2_servers:rke2_agents
  gather_facts: true
  gather_subset: [min, network]
  become: false
  roles: [preflight]

- name: Repository on the admin node
  hosts: rke2_servers
  gather_facts: false
  become: true
  roles: [base]

- name: Repository on the compute nodes
  hosts: rke2_agents
  gather_facts: false
  become: true
  roles: [base]

- name: Install now
  hosts: "{{ hpc_rpms_install_hosts | default('rke2_servers:rke2_agents') }}"
  gather_facts: false
  become: true
  tasks:
    - name: "Install or update: {{ hpc_rpms_install | default([]) | join(', ') }}"
      ansible.builtin.dnf:
        name: "{{ hpc_rpms_install }}"
        state: latest
      when: hpc_rpms_install | default([]) | length > 0
