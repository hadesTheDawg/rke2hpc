[defaults]
roles_path = roles
# parallel ssh connections; raise towards the number of compute nodes on large sites
forks = 50
interpreter_python = auto_silent
callback_result_format = yaml
display_skipped_hosts = false
timeout = 30
# Full output of every run (relative to this file); no_log tasks stay censored.
log_path = .logs/ansible.log
# Lab and site inventories live under inventories/; pick one with -i.

[ssh_connection]
pipelining = True
