---
# In: _users (list). Out: hpc_user_passwords = "user:password user:password ..."
# Initial passwords are generated once, under <hpc_secrets_dir>/users/<name>.
- name: Initial passwords
  ansible.builtin.set_fact:
    _hpc_pw_list: "{{ (_hpc_pw_list | default([])) + [item ~ ':' ~ lookup('ansible.builtin.password', hpc_secrets_dir ~ '/users/' ~ item, length=20, chars=hpc_secret_chars)] }}"
  loop: "{{ _users }}"
  no_log: true
- name: Password list
  ansible.builtin.set_fact:
    hpc_user_passwords: "{{ (_hpc_pw_list | default([])) | join(' ') }}"
    _hpc_pw_list: []
  no_log: true
