# Copy this directory to inventories/<site>/ and edit. Host names are what the
# nodes are called in Kubernetes; ansible_host is the address your laptop uses
# (the management / bond0 network).
all:
  vars:
    ansible_user: deploy                         # sudo-capable account on every node
    # ansible_ssh_private_key_file: ~/.ssh/site_ed25519
    # Reaching the management network through a bastion:
    # ansible_ssh_common_args: "-o ProxyJump=deploy@bastion.example.org"
  children:
    rke2_servers:                                # exactly one: the admin node
      hosts:
        admin01: {ansible_host: 172.16.0.10}
    rke2_agents:                                 # compute nodes (any number)
      hosts:
        cn[001:004]:                             # ranges expand to cn001..cn004
      # per-host addresses: host_vars/cn001.yml with ansible_host: ...
    rpm_fetch:                                   # optional: EL9 x86_64 box with internet
      hosts:
        builder01: {ansible_host: 172.16.0.5}
