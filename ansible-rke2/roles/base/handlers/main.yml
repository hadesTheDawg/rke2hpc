---
# Handlers run at the end of the play: the admin node's play ends before the
# compute nodes' play starts, so they see nginx with its new configuration.
- name: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted

- name: Restart chronyd
  ansible.builtin.systemd_service:
    name: chronyd
    state: restarted
