---
# Runs on every cluster node first (facts are gathered by the play). Catches
# inventory/network mistakes before anything is changed.
- name: Exactly one RKE2 server (the admin node)
  ansible.builtin.assert:
    that: groups['rke2_servers'] | default([]) | length == 1
    fail_msg: "inventory group rke2_servers must contain exactly one host (the admin node)"
  run_once: true

- name: Supported OS
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution_major_version | int == hpc_el_major | int
      - (ansible_facts.architecture == hpc_rpm_arch)
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      {{ ansible_facts.architecture }}; expected EL{{ hpc_el_major }} {{ hpc_rpm_arch }} (hpc_arch={{ hpc_arch }})

- name: Management interface has an IPv4 address
  ansible.builtin.assert:
    that: hpc_mgmt_ip is defined and hpc_mgmt_ip | length > 0
    fail_msg: >-
      {{ inventory_hostname }}: no IPv4 address on management interface '{{ hpc_mgmt_iface }}'
      (interfaces: {{ ansible_facts.interfaces | join(', ') }}). Set hpc_mgmt_iface or hpc_mgmt_ip.

- name: Pod interface has an IPv4 address
  ansible.builtin.assert:
    that: hpc_pod_ip is defined and hpc_pod_ip | length > 0
    fail_msg: >-
      {{ inventory_hostname }}: no IPv4 address on pod interface '{{ hpc_pod_iface }}'
      (interfaces: {{ ansible_facts.interfaces | join(', ') }}). Set hpc_pod_iface ('' = use management).
  when: hpc_pod_iface | length > 0

# Resolved once here and kept as facts, so later plays (and other hosts, via
# hostvars) see each node's addresses.
- name: Record this node's addresses
  ansible.builtin.set_fact:
    hpc_mgmt_ip: "{{ hpc_mgmt_ip }}"
    hpc_pod_ip: "{{ hpc_pod_ip }}"

# With --limit, the nodes left out still appear in /etc/hosts, the firewall
# lists and the cluster checks: read their facts and addresses too.
- name: Facts of cluster nodes outside --limit
  ansible.builtin.setup:
    gather_subset: [min, network]
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ hpc_cluster_hosts | difference(ansible_play_hosts_all) }}"
  run_once: true
  check_mode: false
  ignore_unreachable: true   # its address then comes from the inventory (below)

- name: Their addresses
  ansible.builtin.set_fact:
    hpc_mgmt_ip: >-
      {{ hostvars[item].hpc_mgmt_ip | default(_f[_mi | replace('-', '_')]['ipv4']['address'], true) }}
    hpc_pod_ip: >-
      {{ hostvars[item].hpc_pod_ip | default(_f[(_pi or _mi) | replace('-', '_')]['ipv4']['address'], true) }}
  vars:
    _f: "{{ hostvars[item].ansible_facts }}"
    _mi: "{{ hostvars[item].hpc_mgmt_iface | default(hpc_mgmt_iface) }}"
    _pi: "{{ hostvars[item].hpc_pod_iface | default(hpc_pod_iface) }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ hpc_cluster_hosts | difference(ansible_play_hosts_all) }}"
  run_once: true

# A node that is down or unreachable drops out of the run, but the others
# still list it (/etc/hosts, NFS exports). Its address then comes from the
# inventory: ansible_host, when that is an IPv4 address (the management address).
- name: Addresses of cluster nodes that did not answer (from the inventory)
  ansible.builtin.set_fact:
    hpc_mgmt_ip: "{{ hostvars[item].ansible_host }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ hpc_cluster_hosts | difference(ansible_play_hosts) }}"
  when:
    - hostvars[item].hpc_mgmt_ip is not defined
    - (hostvars[item].ansible_host | default('')) is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
  run_once: true

- name: Cluster nodes without a known address
  ansible.builtin.assert:
    that: _unknown | length == 0
    fail_msg: >-
      {{ _unknown | join(', ') }} did not answer and the inventory gives no IPv4 ansible_host for
      {{ 'it' if _unknown | length == 1 else 'them' }}; the other nodes cannot list them.
      Set hpc_mgmt_ip in their host_vars, or remove them from the inventory.
  vars:
    _unknown: "{{ hpc_cluster_hosts | reject('in', hpc_cluster_hosts | map('extract', hostvars) | selectattr('hpc_mgmt_ip', 'defined')
                  | map(attribute='inventory_hostname') | list) | list }}"
  run_once: true

- name: Networks
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: management {{ hpc_mgmt_iface }} {{ hpc_mgmt_ip }}, pods {{ hpc_pod_iface or hpc_mgmt_iface }} {{ hpc_pod_ip }}"

- name: Pod/service ranges do not overlap the node networks
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress, sys
        nodes = [ipaddress.ip_network(c, strict=False) for c in sys.argv[1].split()]
        for c in sys.argv[2].split():
            k = ipaddress.ip_network(c)
            bad = [str(n) for n in nodes if n.overlaps(k)]
            if bad:
                sys.exit("%s overlaps node network(s) %s" % (k, ", ".join(bad)))
      - "{{ hpc_node_cidrs | join(' ') }}"
      - "{{ hpc_cluster_cidr }} {{ hpc_service_cidr }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  check_mode: false

# Persistent storage for the admin node's state (docs/reprovisioning.md). If the
# mount is missing, writing there would silently land on the local disk that a
# re-provision wipes.
- name: Persistent storage is mounted on the admin node
  ansible.builtin.shell:
    cmd: |
      p="{{ hpc_persist_root }}"
      while [ ! -e "$p" ]; do p=$(dirname "$p"); done
      findmnt -n -o TARGET,FSTYPE -T "$p"
  register: _persist_mnt
  changed_when: false
  check_mode: false
  failed_when: >-
    _persist_mnt.rc != 0 or
    ((hpc_persist_require_mount | bool) and _persist_mnt.stdout.split()[0] == '/')
  when: inventory_hostname == hpc_admin_host and hpc_persist_root | length > 0

- name: Home directories need pods that run as their user
  ansible.builtin.assert:
    that: hpc_home_volume != 'nfs' or hpc_pod_identity == 'uid'
    fail_msg: "hpc_home_volume: nfs mounts homes owned by each user's uid; set hpc_pod_identity: uid as well"
  run_once: true
