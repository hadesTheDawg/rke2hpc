---
# RKE2 from RPM (SELinux policy included). Server on the admin node, agents on
# the compute nodes. Node IP = management address; pod overlay = hpc_pod_iface.
- name: Role of this node
  ansible.builtin.set_fact:
    _rke2_server: "{{ inventory_hostname == hpc_admin_host }}"
    _rke2_svc: "{{ 'rke2-server' if inventory_hostname == hpc_admin_host else 'rke2-agent' }}"

# An installed RKE2 is never reinstalled or changed by a re-run (nor by a newer
# version showing up in the repository): only missing packages are installed,
# RKE2 at exactly hpc_rke2_version. Changing the version of an installed node
# takes -e hpc_rke2_upgrade=true (upgrade.yml).
- name: Installed packages
  ansible.builtin.command:
    argv: [rpm, -q, --qf, "%{NAME} %{VERSION}\n", "{{ _rke2_svc }}", rke2-selinux, nfs-utils]
  register: _rpmq
  changed_when: false
  failed_when: false
  check_mode: false

- name: What is installed
  ansible.builtin.set_fact:
    _rke2_installed: "{{ _have | select('match', '^' ~ _rke2_svc ~ ' ') | map('split') | map('last') | first | default('') }}"
    _rke2_missing: "{{ [_rke2_svc, 'rke2-selinux', 'nfs-utils'] | reject('in', _have | map('split') | map('first') | list) | list }}"
  vars:
    _have: "{{ _rpmq.stdout_lines | reject('search', 'not installed') | list }}"

- name: Install what is missing
  ansible.builtin.dnf:
    name: "{{ _rke2_missing | map('regex_replace', '^(rke2-server|rke2-agent)$', '\\1-' ~ _hpc_rke2_rpm_version) | list }}"
    state: present
  when: _rke2_missing | length > 0

- name: RKE2 already installed
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ _rke2_svc }} {{ _rke2_installed }} is installed{{ '' if _rke2_installed == _hpc_rke2_rpm_version
      else (', hpc_rke2_version is ' ~ hpc_rke2_version ~ '. Left as it is; to change it run site.yml with -e hpc_rke2_upgrade=true (docs/rollback.md)') }}
  when: _rke2_installed | length > 0 and (_rke2_installed != _hpc_rke2_rpm_version) and not (hpc_rke2_upgrade | bool)

- name: Is virt_use_nfs on
  ansible.builtin.command: getsebool virt_use_nfs
  register: _sebool
  changed_when: false
  check_mode: false

- name: Pods may mount NFS volumes (SELinux)
  ansible.builtin.command: setsebool -P virt_use_nfs on
  when: "'--> on' not in _sebool.stdout"

- name: NetworkManager leaves the CNI interfaces alone
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    mode: "0644"
    content: |
      [keyfile]
      unmanaged-devices=interface-name:flannel*;interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
  register: _nm

- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded
  when: _nm.changed

- name: Configuration directories
  ansible.builtin.file:
    path: "{{ item.p }}"
    state: directory
    mode: "{{ item.m }}"
  loop: [{p: /etc/rancher/rke2, m: "0755"}, {p: /etc/rancher/node, m: "0700"}]

- name: Is RKE2 running
  ansible.builtin.command: "systemctl is-active {{ _rke2_svc }}"
  register: _active
  changed_when: false
  failed_when: false
  check_mode: false

# RKE2 otherwise generates a random node password on first start, and the
# server rejects a re-provisioned node that comes back with a different one
# ("Node password rejected"). Derived from secrets/, it is the same every time.
- name: Node password
  ansible.builtin.copy:
    dest: /etc/rancher/node/password
    content: "{{ hpc_rke2_node_password }}"
    mode: "0600"
  register: _npw
  no_log: true

# Only when an already running node switches to the derived password (first
# run of this on an existing cluster): the server still holds the old one.
- name: Forget the node's previous password on the server
  ansible.builtin.command: >-
    {{ hpc_kubectl }} -n kube-system delete secret {{ inventory_hostname }}.node-password.rke2 --ignore-not-found
  delegate_to: "{{ hpc_admin_host }}"
  when: _npw.changed and _active.rc == 0

# Every image comes from the admin node. Unqualified / docker.io references try
# the user registry first, then the system registry.
- name: registries.yaml
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/rke2/registries.yaml
    mode: "0600"
  register: _reg

- name: Server-side files
  ansible.builtin.include_tasks: server-files.yml
  when: _rke2_server

# Nodes that are Harvester VMs (docs/harvester.md): the kubeconfig Harvester
# generated for this cluster; RKE2 runs the Harvester cloud provider and CSI.
- name: Harvester cloud-provider configuration
  when: _hpc_harvester_rke2 | length > 0
  block:
    - name: The site put Harvester's cloud config next to the inventory
      ansible.builtin.stat:
        path: "{{ hpc_harvester_cloud_config_file }}"
      register: _hcc
      delegate_to: localhost
      become: false
    - name: Harvester cloud config present
      ansible.builtin.assert:
        that: _hcc.stat.exists
        fail_msg: "hpc_harvester_guest needs {{ hpc_harvester_cloud_config_file }} (Harvester: Virtual Machines > Generate addon config)"
    - name: Harvester cloud config
      ansible.builtin.copy:
        src: "{{ hpc_harvester_cloud_config_file }}"
        dest: /etc/rancher/rke2/harvester-cloud-config
        mode: "0600"
      register: _hcc_copy

- name: config.yaml
  ansible.builtin.template:
    src: "{{ 'config-server.yaml.j2' if _rke2_server else 'config-agent.yaml.j2' }}"
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  register: _cfg

- name: Change the installed version (hpc_rke2_upgrade)
  ansible.builtin.include_tasks: upgrade.yml
  when: _rke2_installed | length > 0 and _rke2_installed != _hpc_rke2_rpm_version and (hpc_rke2_upgrade | bool)

- name: Restore a re-provisioned server
  ansible.builtin.include_tasks: restore.yml
  when: _rke2_server and _active.rc != 0 and (hpc_rke2_restore | bool) and hpc_backup_dir | length > 0

- name: Start RKE2 (first start imports images; takes a few minutes)
  ansible.builtin.systemd_service:
    name: "{{ _rke2_svc }}"
    enabled: true
    state: started

# A running node whose configuration or version changed is restarted. Compute
# nodes go hpc_agent_batch at a time (0 = all at once), each batch waiting
# for its kubelets to answer before the next starts (docs/operations.md).
- name: Needs a restart
  ansible.builtin.set_fact:
    _rke2_restart: >-
      {{ _active.rc == 0 and (_reg.changed or _cfg.changed or _npw.changed or (_hcc_copy.changed | default(false))
         or (_server_cfg_changed | default(false)) or (_rke2_version_changed | default(false))) }}

- name: Restart the server (configuration or version changed)
  ansible.builtin.systemd_service:
    name: rke2-server
    state: restarted
  when: _rke2_server and _rke2_restart | bool

- name: "Restart compute nodes, {{ hpc_agent_batch if hpc_agent_batch | int > 0 else 'all' }} at a time"
  ansible.builtin.shell:
    cmd: |
      systemctl restart rke2-agent
      for _ in $(seq {{ (hpc_agent_restart_timeout | int / 5) | round(0, 'ceil') | int }}); do
        curl -sf -m 5 http://127.0.0.1:10248/healthz >/dev/null 2>&1 && exit 0
        sleep 5
      done
      echo "kubelet on {{ inventory_hostname }} did not answer within {{ hpc_agent_restart_timeout }} s after the restart" >&2
      exit 1
  throttle: "{{ hpc_agent_batch | int }}"
  when: not _rke2_server and _rke2_restart | bool

- name: Server is ready
  when: _rke2_server
  block:
    - name: kube-apiserver answers
      ansible.builtin.command: "{{ hpc_kubectl }} get --raw /readyz"
      register: _readyz
      until: _readyz.rc == 0
      retries: 120
      delay: 5
      changed_when: false
      check_mode: false
    - name: kubectl and helm for root
      ansible.builtin.file:
        src: /var/lib/rancher/rke2/bin/kubectl
        dest: /usr/local/bin/kubectl
        state: link
    - name: helm
      ansible.builtin.copy:
        src: "{{ hpc_data_root }}/bundle/bin/helm"
        dest: /usr/local/bin/helm
        remote_src: true
        mode: "0755"
    - name: KUBECONFIG for root shells
      ansible.builtin.copy:
        dest: /etc/profile.d/hpc-kube.sh
        mode: "0644"
        content: |
          [ "$(id -u)" = 0 ] && export KUBECONFIG=/etc/rancher/rke2/rke2.yaml

# After an etcd restore the compute nodes' watchers are stale (refresh-agents.yml).
- name: Refresh the compute nodes after a restore
  ansible.builtin.include_tasks: refresh-agents.yml
  when: _rke2_restored | default(false)

# Read by the "All nodes Ready" play: the nodes that got through this role.
- name: RKE2 done on this node
  ansible.builtin.set_fact:
    _hpc_rke2_done: true
