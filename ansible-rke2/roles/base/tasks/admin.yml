---
# ---- repo server (nginx, TLS) ------------------------------------------------
- name: Repository server
  when: _hpc_nginx | bool
  block:
    - name: Packages
      ansible.builtin.dnf:
        name: [nginx, policycoreutils-python-utils]
        state: present
    - name: Web root
      ansible.builtin.file:
        path: "{{ hpc_data_root }}/www"
        state: directory
        mode: "0755"
    - name: CA published at /ca.crt
      ansible.builtin.copy:
        src: /etc/pki/hpc/ca.crt
        dest: "{{ hpc_data_root }}/www/ca.crt"
        remote_src: true
        mode: "0644"
    - name: Served directories
      ansible.builtin.file:
        path: "{{ hpc_data_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ (['charts'] if hpc_enable_charts_repo | bool else []) + (['ui-plugins'] if _hpc_ui_plugins | bool else []) }}"
    - name: SELinux label for served content
      ansible.builtin.shell:
        cmd: |
          set -e
          for t in {{ _hpc_served | join(' ') }}; do
            [ -n "$(semanage fcontext -l -C | awk -v p="$t(/.*)?" '$1==p && /httpd_sys_content_t/')" ] \
              || { semanage fcontext -a -t httpd_sys_content_t "$t(/.*)?" 2>/dev/null \
                   || semanage fcontext -m -t httpd_sys_content_t "$t(/.*)?"; echo "labelled $t"; }
            restorecon -R "$t"
          done
      vars:
        _hpc_served: >-
          {{ [hpc_data_root ~ '/www']
             + ([hpc_data_root ~ '/bundle/rpms'] if hpc_offline_repo | bool else [])
             + ([hpc_data_root ~ '/charts'] if hpc_enable_charts_repo | bool else [])
             + ([hpc_data_root ~ '/ui-plugins'] if _hpc_ui_plugins | bool else []) }}
      register: _label
      changed_when: _label.stdout | length > 0
    - name: Chart repository (docs/charts.md)
      when: hpc_enable_charts_repo | bool
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          d={{ hpc_data_root }}/charts
          out=$(rsync -rt --delete --itemize-changes --exclude=/index.yaml {{ hpc_data_root }}/bundle/charts/ "$d/")
          if [ -n "$out" ] || [ ! -s "$d/index.yaml" ] || ! grep -qF "{{ hpc_charts_url }}/" "$d/index.yaml"; then
            {{ hpc_data_root }}/bundle/bin/helm repo index "$d" --url "{{ hpc_charts_url }}"
            restorecon -R "$d"
            echo "indexed: $(find "$d" -maxdepth 1 -name '*.tgz' | wc -l) charts"
          fi
      register: _charts
      changed_when: _charts.stdout | length > 0
    - name: Rancher UI extension files (Harvester)
      when: _hpc_ui_plugins | bool
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          d={{ hpc_data_root }}/ui-plugins/harvester v={{ hpc_harvester_ui_version }}
          src={{ hpc_data_root }}/bundle/ui-plugins/harvester-$v.tgz
          [ -s "$src" ] || { echo "missing $src (bundle built without hpc_enable_harvester)" >&2; exit 1; }
          if ! cmp -s "$src" "$d/$v.tgz" || [ ! -s "$d/$v/plugin/harvester-$v.umd.min.js" ]; then
            mkdir -p "$d"; rm -rf "$d/$v"
            tar -xzf "$src" -C "$d"
            cp -f "$src" "$d/$v.tgz"
            restorecon -R "$d"
            echo "unpacked harvester $v"
          fi
      register: _uiplug
      changed_when: _uiplug.stdout | length > 0
    - name: Original nginx.conf
      ansible.builtin.include_tasks: keep-original.yml
      vars: {_keep: /etc/nginx/nginx.conf}
    - name: nginx.conf
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: "0644"
        validate: nginx -t -q -c %s
      notify: Restart nginx
    - name: Certificates changed
      ansible.builtin.debug:
        msg: "certificates changed: nginx restarts at the end of this play"
      changed_when: _hpc_certs.changed
      notify: Restart nginx
      when: _hpc_certs.changed
    - name: nginx running
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

# ---- DNS for the cluster domain ------------------------------------------------
# Containers do not read /etc/hosts, so the service names must resolve through
# DNS. CoreDNS forwards the domain here (hpc_coredns_forward_domain); node
# resolvers can point here too. Sites with their own records set hpc_manage_dns=false.
- name: dnsmasq
  when: hpc_manage_dns | bool
  block:
    - name: Package
      ansible.builtin.dnf:
        name: dnsmasq
        state: present
    - name: Configuration
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/hpc.conf
        mode: "0644"
        content: |
          # managed by ansible (hpc base)
          listen-address=127.0.0.1,{{ hpc_admin_ip }}
          bind-interfaces
          no-resolv
          domain-needed
          bogus-priv
          domain={{ hpc_domain }}
          local=/{{ hpc_domain }}/
          expand-hosts
          # tenant applications: <app>.<namespace>.{{ hpc_apps_domain }} -> ingress on the admin node
          address=/{{ hpc_apps_domain }}/{{ hpc_admin_ip }}
    - name: dnsmasq running (restarted, since /etc/hosts is its zone data)
      ansible.builtin.systemd_service:
        name: dnsmasq
        enabled: true
        state: restarted
      changed_when: false

# ---- time source ------------------------------------------------------------------
- name: Time source
  when: hpc_manage_time | bool
  block:
    - name: chrony
      ansible.builtin.dnf:
        name: chrony
        state: present
    - name: Original chrony.conf
      ansible.builtin.include_tasks: keep-original.yml
      vars: {_keep: /etc/chrony.conf}
    - name: chrony.conf
      ansible.builtin.copy:
        dest: /etc/chrony.conf
        mode: "0644"
        content: |
          # managed by ansible (hpc base): the admin node is the cluster's time reference
          {% for s in hpc_ntp_servers %}
          server {{ s }} iburst
          {% endfor %}
          local stratum 10
          {% for c in hpc_node_cidrs %}
          allow {{ c }}
          {% endfor %}
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
      notify: Restart chronyd
    - name: chronyd running
      ansible.builtin.systemd_service:
        name: chronyd
        enabled: true
        state: started
