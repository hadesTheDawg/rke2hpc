# QEMU lab (../lab/lab.sh up). Addresses are the management (bond0) IPs; the
# deployer reaches them through the lab's jump host, as a laptop on the
# management network / VPN would reach a real site.
all:
  vars:
    ansible_ssh_common_args: "-F {{ inventory_dir }}/../../../.lab/ssh_config"
  children:
    rke2_servers:
      hosts:
        a1: {ansible_host: 10.10.0.10}
    rke2_agents:
      hosts:
        c1: {ansible_host: 10.10.0.21}
        c2: {ansible_host: 10.10.0.22}
        c3: {ansible_host: 10.10.0.23}
    rpm_fetch:          # internet-connected EL9 host that resolves the offline RPM repo
      hosts:
        l1: {ansible_host: l1}
