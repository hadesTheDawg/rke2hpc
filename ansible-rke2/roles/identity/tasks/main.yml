---
# Keycloak realm + OIDC clients (kubectl, Rancher), Rancher login through
# Keycloak, platform administrators. Logic: hpc-sync identity.
- name: Admin tools
  ansible.builtin.include_role:
    name: hpc_common
    tasks_from: admin-tools

- name: Platform admin passwords
  ansible.builtin.include_role:
    name: hpc_common
    tasks_from: user-passwords
  vars:
    _users: "{{ hpc_platform_admin_users }}"

- name: hpc-sync identity
  ansible.builtin.command: /usr/bin/python3 /usr/local/sbin/hpc-sync identity
  environment: "{{ hpc_sync_env | combine({
      'HPC_PASSWORDS': hpc_user_passwords,
      'RANCHER_OIDC_SECRET': hpc_rancher_oidc_secret,
      'RANCHER_ADMIN_PASSWORD': hpc_rancher_admin_password,
      'UPSTREAM_OIDC_SECRET': (hpc_upstream_oidc_secret if (hpc_upstream_oidc_spoof or hpc_upstream_oidc_issuer) else '')}) }}"
  register: _sync
  changed_when: "'created' in _sync.stderr or 'updated' in _sync.stderr or 'configured' in _sync.stderr"

- name: hpc-sync output
  ansible.builtin.debug:
    msg: "{{ _sync.stderr_lines }}"
  when: _sync.stderr | length > 0
